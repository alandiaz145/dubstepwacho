name: DubstepWacho CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dubstepwacho-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, build and Sites tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Security tests
        run: npm run test:security
      - name: Production build
        run: npm run build
      - name: Sites packaging tests
        run: npm run test:sites
